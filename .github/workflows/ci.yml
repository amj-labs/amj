name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run workspace checks with logs
        run: python3 tests/run.py rust

      - name: Test logging infrastructure
        if: always()
        run: python3 tests/run.py infra

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-rust-${{ github.run_attempt }}
          path: logs/tests/
          retention-days: 7
          if-no-files-found: warn

  week1:
    name: Week 1 / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sys, sec, ml, ml-sec]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acceptance-test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run completion gate
        run: python tests/run.py ${{ matrix.suite }} --week 1

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-week1-${{ matrix.suite }}-${{ github.run_attempt }}
          path: logs/tests/
          retention-days: 7
          if-no-files-found: warn
